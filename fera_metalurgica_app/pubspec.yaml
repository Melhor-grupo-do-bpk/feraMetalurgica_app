name: fera_metalurgica_app
description: "FERA: orçamentos, catálogo e cronograma para estruturas metálicas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  riverpod_annotation: ^4.0.7
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/catalogo/
    - assets/fonts/

# Ícone e splash do app (D-24). As imagens-fonte ficam em assets/launcher/,
# fora do bundle. Para regerar:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# As cores são as de AppColors.light.background/surface e
# AppColors.dark.background (lib/core/theme/app_colors.dart).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/icone.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/launcher/icone_adaptativo.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#FDF8F8"
  image: assets/launcher/splash.png
  color_dark: "#141312"
  image_dark: assets/launcher/splash.png
  android_12:
    color: "#FDF8F8"
    image: assets/launcher/splash_android12.png
    color_dark: "#141312"
    image_dark: assets/launcher/splash_android12.png
  android: true
  ios: true
  web: false
